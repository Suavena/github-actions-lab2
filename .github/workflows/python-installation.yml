name: Installing Python

on: [push, workflow_dispatch]

jobs:
  build:
    # Dynamically select the operating system based on the matrix
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false so one failing environment doesn't cancel the others
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    # Step 1: Checkout the repository to clone code to the runner
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step 2: Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
